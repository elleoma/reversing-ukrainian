name: Build and Deploy Ukrainian GitBook

on:
  push:
    branches: [ ukrainian-translation, main ]
  pull_request:
    branches: [ ukrainian-translation ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'

    - name: Install dependencies
      run: |
        npm ci

    - name: Install GitBook CLI locally
      run: |
        npm install gitbook-cli@^2.3.2 gitbook@3.2.3

    - name: Install GitBook plugins
      run: |
        npx gitbook install

    - name: Build GitBook
      run: |
        npx gitbook build . _book
        
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: github.ref == 'refs/heads/ukrainian-translation'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./_book
        publish_branch: gh-pages
        cname: your-domain.com  # Optional: replace with your domain
