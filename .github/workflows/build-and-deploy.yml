name: Build and Deploy HonKit Book

on:
  push:
    branches: [ ukrainian-translation, main ]
  pull_request:
    branches: [ ukrainian-translation ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install HonKit
      run: |
        npm install honkit --save-dev
        npx honkit --version

    - name: Install HonKit plugins
      run: |
        npx honkit install

    - name: Build HonKit Book
      run: |
        npx honkit build . _book

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: github.ref == 'refs/heads/ukrainian-translation'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./_book
        publish_branch: gh-pages
        # cname: your-domain.com  # Uncomment if using custom domain
